plugins {
    id 'java'
}

group = 'com.abohasiba'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def paperVersion = project.findProperty('paperVersion') ?: '26.1.2.build.74-stable'

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"

    testImplementation "io.papermc.paper:paper-api:${paperVersion}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

configurations.all {
    exclude group: 'it.unimi.dsi', module: 'fastutil'
    exclude group: 'org.apache.maven'
    exclude group: 'org.apache.maven.resolver'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

jar {
    def classifier = project.findProperty('jarClassifier') ? "-${project.property('jarClassifier')}" : ""
    archiveFileName.set("DragonEgg-${project.version}${classifier}.jar")
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Compiles and generates separate jar files for Paper 26.1, 26.2, and 26.3'
    dependsOn 'jar'
    doLast {
        def targetVersions = [
            '26.1': '26.1.2.build.74-stable',
            '26.2': '26.2.build.134-stable',
            '26.3': '26.3.build.206-stable'
        ]
        targetVersions.each { verTag, paperVer ->
            exec {
                commandLine './gradlew', 'jar', "--rerun-tasks", "-PpaperVersion=${paperVer}", "-PjarClassifier=Paper-${verTag}"
            }
        }
    }
}
