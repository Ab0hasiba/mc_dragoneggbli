name: DragonEgg
version: 1.0.0
main: com.abohasiba.dragonegg.DragonEgg
api-version: '26.1'
description: Legendary Dragon Egg artifact plugin for Paper 26.1, 26.2, and 26.3
author: abohasiba

commands:
  dragonegg:
    description: DragonEgg management command
    permission: dragonegg.admin
    usage: /<command> reload

permissions:
  dragonegg.admin:
    description: Allows reloading the DragonEgg configuration and managing the plugin
    default: op
